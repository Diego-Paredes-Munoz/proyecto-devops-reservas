
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro Médico Vida | Reservas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Centro Médico Vida</h1>
    <p>Sistema de reserva de horas médicas</p>
    <p class="estado">● Servicio disponible (demostración)</p>

    <section>
      <h2>Solicitar hora médica</h2>
      <form>
        <label>Nombre del paciente</label>
        <input type="text" placeholder="Nombre completo">

        <label>Especialidad</label>
        <select>
          <option>Medicina general</option>
          <option>Traumatología</option>
          <option>Cardiología</option>
        </select>

        <label>Fecha de atención</label>
        <input type="date">

        <button type="button">Simular reserva</button>
      </form>
      <p class="nota">Formulario demostrativo. No almacena datos.</p>
    </section>

    <footer>
      Atención: lunes a viernes, 08:00 a 18:00
    </footer>
  </main>
</body>
</html>
